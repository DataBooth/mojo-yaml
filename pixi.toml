[project]
authors = ["Michael Booth <michael@databooth.com.au>"]
channels = ["conda-forge", "https://conda.modular.com/max"]
name = "mojo-yaml"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.0.1-placeholder"  # Not yet implemented

[activation]
env = { MOJO_PATH = "$PIXI_PROJECT_ROOT/src" }

[tasks]
# Development tasks
mojo-version = "mojo --version"

# Individual tests (for quick iteration during development)
test-lexer = "mojo -I src tests/test_lexer.mojo"
test-parser = "mojo -I src tests/test_parser.mojo"
test-writer = "mojo -I src tests/test_writer.mojo"
test-configparser = "mojo -I src tests/test_configparser_compat.mojo"

# Run all tests (auto-discovers test_*.mojo files)
test-all = "python scripts/run_tests.py"

# Build tasks
build-package = "mkdir -p dist && mojo package src/yaml -o dist/yaml.mojopkg"
clean = "rm -rf dist __pycache__ .pytest_cache yaml.mojopkg"

# Example tasks
example-quickstart = "mojo -I src examples/quickstart.mojo"
example-basic = "mojo -I src examples/basic_usage.mojo"
example-nested = "mojo -I src examples/nested_data.mojo"
example-file = "mojo -I src examples/read_file.mojo"
example-all = { depends-on = ["example-quickstart", "example-basic", "example-nested", "example-file"] }

# Benchmark tasks
benchmark-mojo = "python benchmarks/run_mojo_benchmark.py"
benchmark-python = "python benchmarks/compare_python.py"
benchmark-all = { depends-on = ["benchmark-mojo", "benchmark-python"] }

# Code quality tasks
pre-commit = "pre-commit run --all-files"
pre-commit-install = "pre-commit install"

# Release / validation tasks
validate-recipe = "./scripts/validate-recipe.sh recipe.yaml"
pre-submit = "python scripts/pre_submit_checklist.py"
pre-submit-modular-community = "python scripts/pre_submit_checklist.py"

[dependencies]
max = ">=26.1.0,<27"
python = ">=3.11,<4"  # Required for test runner and benchmarks
pre-commit = ">=4.5.1,<5"
pyyaml = "*"  # Required for benchmark comparisons
rattler-build = ">=0.55.1,<0.56"
